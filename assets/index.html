<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Deutsche Kfz-Kennzeichen nachschlagen: Bezirk, Herleitung und Bundesland – auch offline.">
    <meta name="theme-color" content="#003399">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="KFZAPP">
    <link rel="stylesheet" href="main.css">
    <title>KFZAPP – Kennzeichen-Suche</title>
</head>
<body>
    <noscript>KFZAPP benötigt JavaScript.</noscript>
    <div id="root"></div>
    <script src="elm.js" defer></script>
    <script>
        window.addEventListener('DOMContentLoaded', function () {
            Elm.Main.init({
                node: document.getElementById('root')
            });
        });
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function (err) {
                    console.error('Service worker registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
